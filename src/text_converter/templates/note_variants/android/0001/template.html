<!doctype html>
<html class="{{ 'dark' if dark_mode else '' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f4f5f7;
        --status-bg: rgba(31, 44, 52, 0.88);
        --header-bg: rgba(31, 44, 52, 0.88);
        --header-text: #ffffff;
        --status-text: #ffffff;
        --title-color: #ffffff;
        --sub-color: #666;
        --note-bg: #ffffff;
        --note-border: #e3e3e3;
        --body-color: #232323;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }

      .dark {
        --bg: #121212;
        --status-bg: #161616;
        --header-bg: #161616;
        --header-text: #ffffff;
        --status-text: #f2f2f2;
        --title-color: #ffffff;
        --sub-color: #a4a4a4;
        --note-bg: #1f1f1f;
        --note-border: #343434;
        --body-color: #efefef;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
      }

      .screen {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Pulled from android_whatsapp status bar */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 12px;
        height: 32px;
        background: var(--header-bg);
        backdrop-filter: blur(150px);
        -webkit-backdrop-filter: blur(150px);
        color: var(--header-text);
      }

      .status-time {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.14px;
        color: #fff;
      }

      .status-icons {
        display: flex;
        gap: 0px;
        align-items: center;
      }

      .status-icons svg {
        display: block;
      }

      .header {
        height: 46px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--note-border);
        display: flex;
        align-items: center;
        padding: 0 12px;
      }

      .header-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--title-color);
      }

      .content {
        flex: 1;
        padding: 12px;
      }

      .note {
        width: 100%;
        height: 100%;
        background: var(--note-bg);
        border: 1px solid var(--note-border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }

      .note-subtitle {
        padding: 12px 14px 0;
        font-size: 12px;
        color: var(--sub-color);
      }

      .note-body {
        padding: 10px 14px 16px;
        color: var(--body-color);
        font-size: 18px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="status-bar">
        <span class="status-time">{{ status_time }}</span>
        <div class="status-icons">
          {% if 'Samsung' in device_name %}
          <!-- Samsung: copied from android_whatsapp -->
          <svg style="margin-right: 4px" width="16" height="16" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>

          </svg>
          <span style="font-size: 13px; font-weight: 400; color: white; margin-right: 4px">{{battery}}%</span>
          <svg width="6" height="11" viewBox="0 0 8 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="bat-body"><rect x="0.571" y="5.356" width="6.858" height="9.044" /></clipPath></defs>
            <rect x="0.571" y="{{ 14.4 - (9.044 * battery / 100) }}" width="6.858" height="{{ 9.044 * battery / 100 }}" fill="{{ '#ff4444' if battery <= 20 else 'white' }}" clip-path="url(#bat-body)" />
            <path d="M0.701299 15C0.493507 15 0.324675 14.9407 0.194805 14.8222C0.0649351 14.7037 0 14.563 0 14.4V1.82222C0 1.65926 0.0692648 1.51852 0.207793 1.4C0.346321 1.28148 0.510823 1.22222 0.701299 1.22222H2.33766V0H5.66234V1.22222H7.2987C7.48918 1.22222 7.65368 1.28148 7.79221 1.4C7.93074 1.51852 8 1.65926 8 1.82222V14.4C8 14.563 7.93074 14.7037 7.79221 14.8222C7.65368 14.9407 7.48918 15 7.2987 15H0.701299ZM0.571429 5.35556H7.42857V1.68889H0.571429V5.35556Z" fill="white" fill-opacity="0.4"/>
          </svg>
          {% else %}
          <!-- Pixel: copied from android_whatsapp -->

          </svg>
          <svg style="margin-right: 4px" width="14" height="14" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 18V13.5L0 18H4.5Z" fill="white" fill-opacity="{{ '1' if wifi_signal >= 1 else '0.3' }}"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 18H9V9L4.5 13.5V18Z" fill="white" fill-opacity="{{ '1' if wifi_signal >= 2 else '0.3' }}"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M13.5 18V4.5L9 9V18H13.5Z" fill="white" fill-opacity="{{ '1' if wifi_signal >= 3 else '0.3' }}"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M18 18V0L13.5 4.5V18H18Z" fill="white" fill-opacity="{{ '1' if wifi_signal >= 4 else '0.3' }}"/>
          </svg>
          <svg width="6" height="14" viewBox="0 0 8 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 6H8V17C8 17.5523 7.55228 18 7 18H1C0.447715 18 0 17.5523 0 17V6Z" fill="{{ '#ff4444' if battery <= 20 else 'white' }}"/>
            <path d="M0 3C0 2.44772 0.447715 2 1 2H7C7.55228 2 8 2.44772 8 3V6H0V3Z" fill="white" fill-opacity="0.3"/>
            <rect x="2" width="4" height="2" fill="white" fill-opacity="0.3" />
          </svg>
          {% endif %}
        </div>
      </div>
      <div class="header">
        <div class="header-title">Keep Notes</div>
      </div>
      <div class="content">
        <div class="note">
          <div class="note-subtitle">{{ device_name }} · {{ os_name }}</div>
          <div class="note-body">{{ note_text }}</div>
        </div>
      </div>
    </div>
  </body>
</html>
