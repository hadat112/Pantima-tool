<!doctype html>
<html lang="en" class="{{ 'dark' if dark_mode else '' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Messenger - {{ contact_name }}</title>
    <style>
      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Google Fonts: Roboto ── */
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

      /* ── Design tokens from Figma ── */
      :root {
        /* Light theme */
        --bg-primary:       #F3F4F9;
        --on-surface-20:    #001E2F;
        --on-surface-40:    #44474E;
        --on-surface-60:    #74777F;
        --bubble-sent:      #1B72C0;
        --bubble-sent-text: #FFFFFF;
        --bubble-recv:      #FFFFFF;
        --bubble-recv-text: #001E2F;
        --input-bg:         #FFFFFF;
        --input-text:       #74777F;
        --icon-color:       #001E2F;
        --statusbar-text:   #1F1F1F;
        --link-card-bg:     #FFFFFF;
        --link-card-text:   #001E2F;
        --link-card-sub:    #74777F;
      }

      .dark {
        /* Dark theme */
        --bg-primary:       #0E181E;
        --on-surface-20:    #E0F1FF;
        --on-surface-40:    #BFC6DA;
        --on-surface-60:    #A8ADBD;
        --bubble-sent:      #A2C9FF;
        --bubble-sent-text: #13232C;
        --bubble-recv:      #1E2A32;
        --bubble-recv-text: #E0F1FF;
        --input-bg:         #1E2A32;
        --input-text:       #A8ADBD;
        --icon-color:       #FFFFFF;
        --statusbar-text:   #FFFFFF;
        --link-card-bg:     #1E2A32;
        --link-card-text:   #E0F1FF;
        --link-card-sub:    #A8ADBD;
      }

      /* ── Base ── */
      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Roboto', sans-serif;
        background: var(--bg-primary);
        color: var(--on-surface-20);
        overflow: hidden;
      }

      .screen {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        background: var(--bg-primary);
        overflow: hidden;
      }

      /* ── Status Bar ── */
      .statusbar {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        padding: 10px 24px;
        height: 52px;
        flex-shrink: 0;
        background: var(--bg-primary);
      }

      .statusbar-time {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.43;
        letter-spacing: 0.14px;
        color: var(--statusbar-text);
      }

      .statusbar-icons {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 17px;
      }

      .statusbar-icons svg {
        fill: var(--statusbar-text);
      }

      /* ── Top App Bar ── */
      .topbar {
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 64px;
        padding: 0 16px;
        background: var(--bg-primary);
        flex-shrink: 0;
        position: relative;
      }

      .topbar-back {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
      }

      .topbar-back svg,
      .topbar-actions svg {
        fill: var(--icon-color);
      }

      .topbar-title {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.27;
        color: var(--on-surface-20);
        margin-left: 16px;
        flex: 1;
      }

      .topbar-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 24px;
        margin-left: auto;
      }

      .topbar-actions button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Messages area ── */
      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: none;
      }

      .messages-area::-webkit-scrollbar { display: none; }

      /* ── Timestamp ── */
      .timestamp {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px;
        align-self: stretch;
      }

      .timestamp span {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.67;
        letter-spacing: 0.25px;
        color: var(--on-surface-40);
        text-align: center;
      }

      /* ── Message rows ── */
      .msg-row-recv {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 0 16px;
        width: 100%;
      }

      .msg-row-sent {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        align-self: stretch;
        padding: 0 16px;
        width: 100%;
      }

      .msg-frame-recv {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        gap: 8px;
        width: 100%;
      }

      .msg-frame-sent {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        align-items: flex-end;
        gap: 8px;
        width: 100%;
      }

      /* ── Avatar ── */
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        overflow: hidden;
      }

      /* ── Bubble ── */
      .bubble {
        display: flex;
        flex-direction: row;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 22px;
        max-width: calc(100% - 60px);
      }

      .bubble-recv {
        background: var(--bubble-recv);
        color: var(--bubble-recv-text);
      }

      .bubble-sent {
        background: var(--bubble-sent);
        color: var(--bubble-sent-text);
      }

      .bubble-text {
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.5px;
      }

      /* ── Link card (website preview) ── */
      .link-card {
        border-radius: 24px;
        overflow: hidden;
        max-width: calc(100% - 60px);
        background: var(--link-card-bg);
      }

      .link-card-image {
        width: 100%;
        height: 151px;
        object-fit: cover;
        background: #ccc;
        display: block;
      }

      .link-card-image-placeholder {
        width: 100%;
        height: 151px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 32px;
      }

      .link-card-body {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .link-card-title {
        font-size: 14px;
        font-weight: 400;
        line-height: 1.43;
        letter-spacing: 0.25px;
        color: var(--link-card-text);
      }

      .link-card-url {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.67;
        letter-spacing: 0.25px;
        color: var(--link-card-sub);
      }

      /* ── Input bar ── */
      .input-bar {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        padding: 16px;
        background: var(--bg-primary);
        flex-shrink: 0;
      }

      .input-bar-icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .input-bar-icon svg {
        fill: var(--icon-color);
      }

      .input-field {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--input-bg);
        border-radius: 32px;
      }

      .input-field-text {
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.15px;
        color: var(--input-text);
        flex: 1;
      }

      /* ── Home indicator ── */
      .home-indicator {
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        flex-shrink: 0;
      }

      .home-indicator-bar {
        width: 72px;
        height: 4px;
        border-radius: 2px;
        background: var(--on-surface-20);
        opacity: 0.2;
      }
    </style>
  </head>

  <body>
    <div class="screen {{ 'dark' if dark_mode else '' }}">

      <!-- Status Bar -->
      <div class="statusbar">
        <span class="statusbar-time">{{ status_time }}</span>
        <div class="statusbar-icons">

            <rect x="8" y="3" width="3" height="9" rx="0.5" fill="currentColor" style="color: var(--statusbar-text)"/>

          <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect opacity="0.35" x="0.5" y="0.5" width="21" height="10.333" rx="2.167" stroke="currentColor" style="color: var(--statusbar-text)"/>

          </svg>
        </div>
      </div>

      <!-- Top App Bar -->
      <div class="topbar">
        <div class="topbar-back">

            </mask>

            </g>
          </svg>
        </div>
        <span class="topbar-title">{{ contact_name }}</span>
        <div class="topbar-actions">
          <!-- Call icon from Figma -->
          <button aria-label="Call">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <mask id="mask0_603_104" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">

              </g>
            </svg>
          </button>

          <button aria-label="Search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

              </g>
            </svg>
          </button>
          <!-- More icon from Figma -->
          <button aria-label="More">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <mask id="mask0_603_110" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">

              </g>
            </svg>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-area">

        {% if message_time %}
        <div class="timestamp">
          <span>{{ message_time }}</span>
        </div>
        {% endif %}

        {% for msg in messages %}
          {% if msg.role == "sent" %}
          <div class="msg-row-sent">
            <div class="msg-frame-sent">
              <div class="bubble bubble-sent">
                <span class="bubble-text">{{ msg.text }}</span>
              </div>
            </div>
          </div>
          {% else %}
          <div class="msg-row-recv">
            <div class="msg-frame-recv">
              <div class="avatar" style="background-color: {{ msg.color }}">
                {{ msg.display_name[0] | upper if msg.display_name else "?" }}
              </div>
              <div class="bubble bubble-recv">
                <span class="bubble-text">{{ msg.text }}</span>
              </div>
            </div>
          </div>
          {% endif %}
        {% endfor %}

      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <!-- Camera icon from Figma -->
        <div class="input-bar-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <mask id="mask0_603_153" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">

            </g>
          </svg>
        </div>
        <!-- Image icon from Figma -->
        <div class="input-bar-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <mask id="mask0_603_157" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
              <rect width="24" height="24" fill="#D9D9D9"/>
            </mask>

            </g>
          </svg>
        </div>
        <!-- Message input field -->
        <div class="input-field">
          <span class="input-field-text">Message</span>
        </div>
      </div>

      <!-- Home Indicator (Android nav bar) -->
      <div class="home-indicator">
        <div class="home-indicator-bar"></div>
      </div>

    </div>
  </body>
</html>
